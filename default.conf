# /etc/nginx/conf.d/default.conf
server {
    listen 80;
    server_name abt.bits.bo;

    root /usr/share/nginx/html;
    index index.html;

    # IP real desde proxy
    real_ip_header X-Forwarded-For;
    set_real_ip_from 0.0.0.0/0;  # All
    real_ip_recursive on;

    # Angular frontend SPA
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache diferenciado para recursos estáticos
    location ~* \.(?:woff2?|eot|ttf|otf|svg|ico|jpg|jpeg|png|gif|webp)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }
    
    # Cache más corto para JS/CSS (pueden cambiar con deployments)
    location ~* \.(?:js|css)$ {
        expires 1h;
        access_log off;
        add_header Cache-Control "public, max-age=3600";
        # Añadir ETag para mejor control de cache
        etag on;
    }

    location = /index.html {
        expires 0;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
    }

    # Seguridad
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header X-XSS-Protection "1; mode=block";

    error_page 404 /index.html;

    large_client_header_buffers 4 16k;
}
