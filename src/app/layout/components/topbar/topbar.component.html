<div class="layout-topbar text-center relative w-full gap-5">
    <!-- <div class="layout-topbar-logo hidden md:flex">
        <div class="topbar-logo-badge">
            <img
                src="assets/images/logo.png"
                class="topbar-logo-img"
                alt="Mi Pimpollito"
            />
        </div>
    </div> -->

    @if (isDevFirebase) {
    <span
        class="absolute top-1 left-1 md:left-16 firebase-dev-badge text-[10px] font-bold uppercase px-2 py-0.5 rounded"
        [title]="'Este build habla con Firebase ' + firebaseProjectId"
        >Firebase DEV</span
    >
    }

    <!-- botón para desplegar el sidebar -->
    <button
        #menubutton
        class="p-link layout-menu-button layout-topbar-button inline-flex md:hidden"
        (click)="layoutService.onMenuToggle()"
    >
        <i class="fa-solid fa-bars"></i>
    </button>

    <div
        class="flex gap-2 justify-center items-center w-[65%] md:w-full text-center"
    >
        <div
            class="text-center text-white font-bold text-xl md:text-2xl lg:text-3xl"
        >
            Mi Pimpollito
        </div>
    </div>

    <!--
        FASE 0A: el avatar queda como marcador. En la FASE 1 vuelve a mostrar
        las iniciales o la foto del usuario desde SessionService, y el panel
        de usuario con "Perfil" y "Cerrar sesión".
    -->
    @if (showProfile()) {
    <button
        class="cursor-pointer layout-topbar-profile rounded-full bg-white relative overflow-hidden"
        (click)="toggleMenu($event)"
    >
        @if (initials()) {
        <div class="font-bold text-primary text-2xl">{{ initials() }}</div>
        } @else {
        <div class="text-primary">
            <i class="fas fa-user text-4xl"></i>
        </div>
        }
    </button>
    } @else {
    <div class="flex items-center layout-topbar-session gap-4 w-32 md:w-60">
        <a
            routerLink="/auth/login"
            class="text-white hover:text-white hover:underline text-lg md:text-xl"
        >
            {{ "app.auth.login.submit" | translate }}
        </a>
    </div>
    }
</div>


<p-overlayPanel
    #overlay
    [dismissable]="true"
    styleClass="user-menu-panel"
>
    <div class="user-menu">
        <!-- Información del usuario -->
        <div class="user-menu-header">
            <div class="user-menu-name" [title]="fullName()">
                {{ fullName() }}
            </div>

            <div class="user-menu-email" [title]="userEmail()">
                {{ userEmail() }}
            </div>
        </div>

        <!-- Separador -->
        <div class="user-menu-divider"></div>

        <!-- Opciones del usuario -->
        <div class="user-menu-actions">
            <!-- Cambiar contraseña -->
            <button
                type="button"
                class="user-menu-action"
                (click)="openChangePassword()"
            >
                <span class="user-menu-action-icon">
                    <i class="fas fa-key"></i>
                </span>

                <span class="user-menu-action-label">
                    {{ "app.profile.changePassword" | translate }}
                </span>

                <i class="fas fa-chevron-right user-menu-chevron"></i>
            </button>

            <!-- Cerrar sesión -->
            <button
                type="button"
                class="user-menu-action user-menu-action-logout"
                (click)="logout()"
            >
                <span class="user-menu-action-icon">
                    <i class="fas fa-right-from-bracket"></i>
                </span>

                <span class="user-menu-action-label">
                    {{ "app.auth.logout" | translate }}
                </span>

                <i class="fas fa-chevron-right user-menu-chevron"></i>
            </button>
        </div>
    </div>
</p-overlayPanel>

<app-change-password-dialog
    [visible]="changePasswordVisible()"
    (visibleChange)="changePasswordVisible.set($event)"
></app-change-password-dialog>
