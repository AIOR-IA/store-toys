<ul class="layout-menu pt-10 mt-10">
    <ng-container *ngFor="let item of model(); let i = index">
        <li
            app-menu-item
            *ngIf="!item.separator"
            [item]="item"
            [index]="i"
            [root]="true"
        ></li>
        <li *ngIf="item.separator" class="menu-separator"></li>
    </ng-container>
</ul>
