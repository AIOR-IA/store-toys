<div
    class="bg-gray-100 flex items-center justify-center h-screen w-screen overflow-hidden"
>
    <main
        class="flex flex-col items-center justify-center p-2 lg:p-0 min-w-80%"
    >
        <section class="bg-white rounded-xl p-6 shadow-lg max-w-md text-center">
            <div class="flex gap-4 justify-center items-end">
                <i
                    class="fas fa-exclamation-triangle text-yellow-500 text-6xl mb-5"
                    aria-hidden="true"
                    alt="Warning icon"
                ></i>
                <h1 class="text-6xl font-bold mb-2">404</h1>
            </div>
            <h1 class="text-3xl font-bold mb-2">Página no encontrada</h1>
            <p class="text-gray-500">
                La página que intentas visitar no existe o ha sido movida.
            </p>
            <p class="text-gray-500">
                Verifica la dirección o vuelve al inicio.
            </p>
            <div class="mt-5 flex justify-center items-center gap-4">
                <a
                    href="/"
                    class="p-button px-4 py-3 bg-primary rounded-full text-white hover:text-white hover:bg-primary-dark transition duration-300 ease-in-out"
                    >Inicio</a
                >

                <a
                    (click)="goBack()"
                    class="px-4 py-3 bg-brand rounded-full text-white hover:cursor-pointer hover:text-white hover:bg-brand-dark transition duration-300 ease-in-out"
                    >Volver Atrás</a
                >
            </div>
        </section>
    </main>
</div>
