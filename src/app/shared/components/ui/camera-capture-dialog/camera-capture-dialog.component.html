<p-dialog
    [visible]="visible()"
    (visibleChange)="cancel()"
    [modal]="true"
    [draggable]="false"
    [style]="{ width: 'min(95vw, 40rem)' }"
    appendTo="body"
    [header]="'app.camera.title' | translate"
>
    <div class="flex flex-col gap-3">
        <div
            class="relative flex items-center justify-center bg-black rounded overflow-hidden min-h-[12rem] w-full"
        >
            @if (capturedUrl()) {
            <img
                [src]="capturedUrl()"
                alt=""
                class="w-full object-contain"
                style="max-height: 60vh"
            />
            }
            <video
                #video
                autoplay
                playsinline
                muted
                class="w-full object-contain"
                [class.hidden]="capturedUrl()"
                style="max-height: 60vh"
            ></video>
            @if (cameraLoading()) {
            <div class="absolute inset-0 flex items-center justify-center text-white text-sm">
                {{ "app.camera.loading" | translate }}
            </div>
            }
        </div>

        @if (errorKey()) {
        <p class="text-danger text-sm">{{ errorKey()! | translate }}</p>
        }

        <div class="flex flex-wrap justify-end gap-2">
            <button
                pButton
                type="button"
                class="p-button-secondary"
                [label]="'app.common.cancel' | translate"
                (click)="cancel()"
            ></button>
            @if (capturedUrl()) {
            <button
                pButton
                type="button"
                class="p-button-outlined"
                icon="fas fa-rotate-left"
                [label]="'app.camera.retake' | translate"
                (click)="retake()"
            ></button>
            <button
                pButton
                type="button"
                icon="fas fa-check"
                [label]="'app.camera.usePhoto' | translate"
                (click)="accept()"
            ></button>
            } @else {
            <button
                pButton
                type="button"
                icon="fas fa-camera"
                [label]="'app.products.form.takePicture' | translate"
                [disabled]="!liveReady() || busy()"
                (click)="capture()"
            ></button>
            }
        </div>
    </div>
</p-dialog>
