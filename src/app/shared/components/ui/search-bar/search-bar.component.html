<div class="flex flex-col md:flex-row gap-10 justify-between items-center"
     [ngClass]="compact() ? 'py-0 md:py-0' : 'py-4 md:py-6'">
  @if(title()) { }
  <p class="text-lg font-semibold text-black">{{ title() }}</p>

  <div class="mb-4 flex gap-4">
    <ng-content></ng-content>
    <div class="flex items-center">
      <input
        pInputText
        [(ngModel)]="searchValue"
        class="w-full py-3 px-4 border border-gray-300 rounded-r-none rounded-l-lg shadow-sm"
        (keyup.enter)="search()"
        [placeholder]="
          (placeholder() || '') === ''
            ? ('app.common.search' | translate) + '...'
            : (placeholder() || '' | translate)
        "
      />
      @if(thin()) {
      <p-button
        icon="fas fa-search"
        iconPos="right"
        (onClick)="search()"
        styleClass="p-button-primary rounded-l-none rounded-r-lg"
      >
      </p-button>

      } @else {
      <p-button
        [label]="'app.common.search' | translate"
        icon="fas fa-search"
        iconPos="right"
        (onClick)="search()"
        styleClass="p-button-primary rounded-l-none rounded-r-lg"
      >
      </p-button>
      }
    </div>
  </div>
</div>
