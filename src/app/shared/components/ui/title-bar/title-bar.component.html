<div class="w-full bg-gray-50 mb-4 py-1 flex justify-between items-center">
    <div class="w-full md:w-1/2 flex gap-4 justify-start items-center">
        <button
            pButton
            type="button"
            icon="fas fa-chevron-left"
            class="p-button-secondary p-button-rounded"
            (click)="goBack()"
        ></button>

        <div class="flex-1">
            <div class="text-2xl font-semibold capitalize">{{ title() }}</div>
            <div class="text-sm text-gray-500">{{ description() }}</div>
        </div>
    </div>
    <div class="text-right flex justify-end items-start">
        @if(newPath() || newLabel()){
        <button
            pButton
            type="button"
            icon="fas fa-plus"
            class="p-button-info p-button-text"
            [label]="newLabel() || ('app.common.new' | translate)"
            (click)="goToNewPath(newPath(), $event)"
        ></button>
        } @if(editPath() || editLabel()){
        <button
            pButton
            type="button"
            icon="fas fa-pencil-alt"
            class="p-button-info p-button-text"
            [label]="editLabel() || ('app.common.edit' | translate)"
            (click)="goToEditPath(editPath(), $event)"
        ></button>
        }
        <ng-content></ng-content>
    </div>
</div>
