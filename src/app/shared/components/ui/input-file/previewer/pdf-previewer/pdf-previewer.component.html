<div class="pdf-previewer-container">
    <!-- Thumbnail Preview -->
    <div *ngIf="showThumbnail()" class="thumbnail-container">
        <!-- Loading state -->
        <div
            *ngIf="loadingThumbnail()"
            class="flex flex-col items-center justify-center p-4"
        >
            <p-progressBar
                mode="indeterminate"
                styleClass="w-full mb-2"
            ></p-progressBar>
            <span class="text-sm text-gray-600">Generando vista previa...</span>
        </div>

        <!-- Error state -->
        <div
            *ngIf="thumbnailError() && !loadingThumbnail()"
            class="flex flex-col items-center justify-center p-4 bg-gray-100 rounded-lg"
        >
            <i
                class="pi pi-exclamation-triangle text-3xl text-orange-500 mb-2"
            ></i>
            <span class="text-sm text-gray-600 mb-2"
                >Error al generar vista previa</span
            >
            <p-button
                label="Reintentar"
                icon="pi pi-refresh"
                size="small"
                severity="secondary"
                (onClick)="retryThumbnail()"
            >
            </p-button>
        </div>

        <!-- Thumbnail image -->
        <div
            *ngIf="thumbnailUrl() && !loadingThumbnail() && !thumbnailError()"
            class="thumbnail-image-container cursor-pointer transition-transform hover:scale-105"
            (click)="onThumbnailClick()"
        >
            <img
                [src]="thumbnailUrl()!"
                alt="PDF Preview"
                class="w-full h-auto rounded-lg shadow-md border border-gray-200"
                [style.max-width.px]="thumbnailWidth()"
                [style.max-height.px]="thumbnailHeight()"
            />
            <div
                class="overlay absolute inset-0 bg-black bg-opacity-0 hover:bg-opacity-10 transition-all duration-200 rounded-lg flex items-center justify-center"
            >
                <i
                    class="pi pi-eye text-white text-2xl opacity-0 hover:opacity-100 transition-opacity duration-200"
                ></i>
            </div>
        </div>

        <!-- View PDF Button -->
        <div class="mt-2 text-center">
            <p-button
                label="Ver Archivo"
                icon="fas fa-file-pdf"
                [severity]="'primary'"
                [text]="true"
                size="small"
                (onClick)="onViewPDF()"
            >
            </p-button>

            <p-button
                label="Descargar Archivo"
                icon="fas fa-download"
                [severity]="'info'"
                [text]="true"
                size="small"
                (onClick)="onDownloadPDF()"
            >
            </p-button>

        </div>
    </div>

    <!-- Vista online (si está habilitada) -->
    @if(viewPdfOnline()) {
    <pdf-viewer
        id="print-area"
        [src]="fileUrl()"
        [render-text]="true"
        [original-size]="false"
        [zoom]="0.9"
        [fit-to-page]="true"
        [show-borders]="true"
        (after-load-complete)="afterPdfLoadComplete($event)"
        [style.width.%]="100"
        [style.min-height.px]="height()"
    ></pdf-viewer>
    } @else {
    <!-- Modal para vista completa del PDF -->
    <p-dialog
        header="Previsualización"
        [modal]="true"
        [(visible)]="viewModal"
        [style]="{ width: '50rem' }"
        [breakpoints]="{ '1199px': '75vw', '575px': '90vw' }"
        [maximizable]="false"
        appendTo="body"
    >
        <div *ngIf="loadingPdf()" class="loading-container">
            <p-progressBar mode="indeterminate"></p-progressBar>
            <p class="mt-2">Cargando PDF...</p>
        </div>

        <pdf-viewer
            id="print-area"
            [src]="fileUrl()"
            [render-text]="true"
            [original-size]="false"
            [zoom]="1"
            [fit-to-page]="true"
            [show-borders]="true"
            (after-load-complete)="afterPdfLoadComplete($event)"
            style="width: 100%; height: 650px"
        >
        </pdf-viewer>
    </p-dialog>

    <!-- Botón para abrir PDF (solo si no se muestra thumbnail) -->
    <div *ngIf="!showThumbnail()" class="w-full text-center">
        <button
            pButton
            type="button"
            class="p-button-info p-button-sm p-button-text"
            label="Ver Archivo"
            icon="fas fa-file-pdf"
            (click)="onViewPDF()"
        ></button>
    </div>
    } @if(loadingPdf() && viewPdfOnline()){
    <div class="w-full text-center text-sm my-4 p-8 absolute top-1/2">
        <div class="font-bold">Archivo PDF</div>
        <p-progressBar
            aria-labelledby="label_status"
            mode="indeterminate"
            [style]="{ height: '6px' }"
        >
        </p-progressBar>
        <span id="label_status" class="font-light font-italic">
            Cargando archivo...
        </span>
    </div>
    }
</div>
