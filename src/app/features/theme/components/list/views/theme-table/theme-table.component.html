<p-table
    [value]="state.items"
    [paginator]="true"
    [rows]="state.meta.perPage"
    [first]="state.meta.first || 1"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    dataKey="id"
    [totalRecords]="state.meta.total"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    (onLazyLoad)="loadLazy($event)"
    styleClass="p-datatable-striped"
    [loading]="state.loading"
    [tableStyle]="{ 'min-width': '100%' }"
>
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="title">
                <div class="table-th">
                    <label>{{ "app.theme.title" | translate }}</label>
                    <p-sortIcon field="title"></p-sortIcon>
                </div>
            </th>
            <th pSortableColumn="description" style="width: 50%">
                <div class="table-th">
                    <label>{{ "app.theme.description" | translate }}</label>
                    <p-sortIcon field="description"></p-sortIcon>
                </div>
            </th>
            <th pSortableColumn="createdAt" style="width: 50%">
                <div class="table-th">
                    <label>{{ "app.theme.created" | translate }}</label>
                    <p-sortIcon field="createdAt"></p-sortIcon>
                </div>
            </th>
            <th style="width: 10%"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <td>{{ item.title }}</td>
            <td>{{ item.description }}</td>
            <td>{{ item.createdAt | date: "dd/MM/yyyy HH:mm" }}</td>
            <td>
                <div class="w-full text-right">
                    <app-theme-options [item]="item"></app-theme-options>
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="100%">
                <app-items-not-found></app-items-not-found>
            </td>
        </tr>
    </ng-template>
</p-table>
