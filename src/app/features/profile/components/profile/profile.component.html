<article>
    <p-toast></p-toast>

    <app-body-header
        [breadcrumbs]="breadcrumbItems()"
        [viewButtons]="false"
        [resource]="'PROFILE'"
    ></app-body-header>

    <p-card>
        <header>
            <h1 class="font-bold text-4xl m-0 p-0 text-primary">Perfil</h1>
        </header>

        <section class="mt-4">
            <form
                (onsubmit)="onSubmit()"
                [formGroup]="profileForm()"
                class="m-0 p-0 w-full h-full flex flex-col gap-4"
            >
                <section
                    class="flex flex-col gap-2 pb-4"
                    [style]="{ borderBottom: '1px solid gray' }"
                >
                    <h2 class="font-bold text-xl m-0 p-0 text-primary">
                        Información Básica
                    </h2>

                    <section class="flex flex-col gap-4 max-w-[700px] pl-2">
                        <div class="grid grid-cols-2 items-center">
                            <div class="flex flex-col">
                                <h3 class="font-bold text-lg m-0 p-0 text-primary">
                                    {{ 'app.users.username' | translate }}
                                </h3>

                                <p class="text-lg m-0 p-0">
                                    {{ user().username }}
                                </p>
                            </div>

                            <div class="flex flex-col">
                                <h3 class="font-bold text-lg m-0 p-0 text-primary">
                                    {{ 'app.users.email' | translate }}
                                </h3>

                                <p class="text-lg m-0 p-0">
                                    {{ user().email }}
                                </p>
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <label
                                for="firstName"
                                class="font-bold text-black text-lg m-0 p-0"
                                >{{ 'app.users.firstName' | translate }}</label
                            >

                            <input
                                id="firstName"
                                class="text-lg m-0"
                                pInputText
                                formControlName="firstName"
                            />
                        </div>

                        <div class="grid grid-cols-2 gap-4 items-center">
                            <div class="flex flex-col">
                                <label
                                    for="paternalLastName"
                                    class="font-bold text-lg m-0 p-0 text-black"
                                >
                                {{ 'app.users.paternalLastName' | translate }}
                                </label>

                                <input
                                    id="paternalLastName"
                                    class="text-lg m-0"
                                    pInputText
                                    formControlName="paternalLastName"
                                />
                            </div>

                            <div class="flex flex-col">
                                <label
                                    for="maternalLastName"
                                    class="font-bold text-lg m-0 p-0 text-black"
                                >
                                {{ 'app.users.maternalLastName' | translate }}
                                </label>

                                <input
                                    id="maternalLastName"
                                    class="text-lg m-0"
                                    pInputText
                                    formControlName="maternalLastName"
                                />
                            </div>
                        </div>

                        <div class="flex flex-col">
                            <h3 class="font-bold text-lg m-0 p-0 text-primary">
                                {{ 'app.users.password' | translate }}
                            </h3>

                            @if (!showChangePassword()) {
                            <button
                                (click)="toggleShowChangePassword()"
                                [style]="{ maxWidth: 'max-content' }"
                                type="button"
                                pButton
                            >
                                Cambiar Contraseña
                            </button>
                            } @if (showChangePassword()) {
                            <app-change-password
                                [userId]="user().id"
                                (closeEmitter)="toggleShowChangePassword()"
                            ></app-change-password>
                            }
                        </div>
                    </section>
                </section>

                <!-- <section
                    class="flex flex-col gap-2 pb-4"
                    [style]="{ borderBottom: '1px solid gray' }"
                >
                    <h2 class="font-bold text-xl m-0 p-0">
                        Información de Contacto
                    </h2>

                    <section class="flex flex-col gap-4 max-w-[700px] pl-2">
                        <div class="flex flex-cols-2">
                          <div class="flex flex-col">
                            <label
                              for="cellphone"
                              class="font-bold text-black text-lg m-0 p-0"
                              >{{ 'app.users.cellphone' | translate }}</label
                          >

                          <input
                              id="cellphone"
                              class="text-lg m-0"
                              pInputText
                              formControlName="cellphone"
                          />
                          </div>

                      </div>


                    </section>
                </section> -->
                <div class="flex gap-4">
                    <button
                        pButton
                        [disabled]="!hasChanged() || !profileForm().valid"
                        type="button"
                        (click)="onSubmit()"
                        appPermissions
                        [action]="action"
                        [resource]="resource"
                    >
                        Actualizar
                    </button>

                    @if (hasChanged()) {
                    <button
                        pButton
                        type="button"
                        class="ml-2"
                        severity="secondary"
                        (click)="resetForm()"
                        [loading]="loading()"
                        loadingIcon="fas fa-spinner fa-spin"
                    >
                        Cancelar
                    </button>
                    }
                </div>
            </form>
        </section>
    </p-card>
</article>
