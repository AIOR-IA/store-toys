<app-body-header
    [breadcrumbs]="breadcrumbItems()"
    createPath="/admin/roles/new"
    [createLabel]="'app.roles.new' | translate"
    (onViewChange)="onViewChange($event)"
    [resource]="state.resources.ROLES"
></app-body-header>

<app-search-bar (onSearch)="onSearch($event)"></app-search-bar>

<p-messages [(value)]="messages" [enableService]="false" />

@if(isGridView) {
<app-role-card-view></app-role-card-view>
}@else {
<app-role-table-view></app-role-table-view>
}
