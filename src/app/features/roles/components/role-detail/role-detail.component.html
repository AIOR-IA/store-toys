<app-body-header
    [breadcrumbs]="breadcrumbItems()"
    [viewButtons]="false"
    [resource]="state.resources.ROLES"
></app-body-header>
<app-title-bar
    [title]="'app.roles.details' | translate"
    [editLabel]="'app.roles.edit' | translate"
    [editPath]="'/admin/roles/' + params().uuid + '/edit'"
    [resource]="state.resources.ROLES"
>
    <button
        appPermissions
        [resource]="state.resources.ROLES"
        [action]="SystemAccessPermissions.CAN_MANAGE"
        pButton
        type="button"
        icon="fas fa-key"
        class="p-button-warning p-button-text"
        [label]="'app.roles.permissions.list' | translate"
        [routerLink]="['/admin/roles', params().uuid, 'permissions']"
    >
    </button>
</app-title-bar>
<app-role-form-shared mode="view"></app-role-form-shared>
