<div class="mx-auto mx-screen-xl">
    <div class="grid grid-cols-4 gap-4">
        @for (item of items; track $index;) { @let user = getUser(item);
        <div class="bg-white rounded-lg shadow-md max-w-80 h-96 overflow-auto">
            <!-- <img
                    [src]="item.image"
                    alt="Usuario"
                    class="w-full object-contain object-center h-52 mb-4"
                /> -->
            <div class="h-52 bg-theme-secondary"></div>
            <div class="p-4 relative h-44 leading-relaxed">
                <h2 class="text-xl font-bold mb-2 line-clamp-1">
                    <a href="#" (click)="openUserDetail(item.uuid); $event.preventDefault()">
                        {{ user.fullName }}
                    </a>
                </h2>
                <div class="text-gray-600 line-clamp-3">
                    <i class="fas fa-at"></i>
                    {{ user.email }}
                </div>
                @if(!user.accountConfirmed && user.isApproved) {
                <p-chip
                    [label]="'app.users.notConfirmed' | translate"
                    styleClass="text-xs bg-warning-soft rounded-none absolute bottom-1 left-0"
                ></p-chip>
                }
                <div class="absolute right-0 bottom-1">
                    <app-user-menu-options
                        [item]="user"
                    ></app-user-menu-options>
                </div>
            </div>
        </div>
        } @empty {
        <div class="col-span-4">
            <app-items-not-found></app-items-not-found>
        </div>
        }
    </div>

    <app-cards-paginator
        [hasNextPage]="userState.hasNextPage"
        [hasPreviousPage]="userState.hasPreviousPage"
        (onNext)="onNextPage($event)"
        (onPrevious)="onPreviousPage($event)"
    ></app-cards-paginator>
</div>
