<p-table
    [value]="state.items"
    [paginator]="true"
    [rows]="state.meta.perPage"
    [first]="state.meta.first || 1"
    [rowsPerPageOptions]="[5, 10, 20, 50]"
    dataKey="id"
    [totalRecords]="state.meta.total"
    [lazy]="true"
    [lazyLoadOnInit]="false"
    (onLazyLoad)="loadLazy($event)"
    styleClass="p-datatable-striped"
    [loading]="state.loading"
    [tableStyle]="{ 'min-width': '100%' }"
>
    <ng-template pTemplate="header">
        <tr>
            <th pSortableColumn="label">
                <div class="table-th">
                    <label>{{ "app.webMapService.label" | translate }}</label>
                    <p-sortIcon field="label"></p-sortIcon>
                </div>
            </th>
            <th pSortableColumn="url" style="width: 50%">
                <div class="table-th">
                    <label>{{ "URL" | translate }}</label>
                    <p-sortIcon field="url"></p-sortIcon>
                </div>
            </th>
            <th pSortableColumn="group" style="width: 50%">
                <div class="table-th">
                    <label>{{ "app.webMapService.group" | translate }}</label>
                    <p-sortIcon field="group"></p-sortIcon>
                </div>
            </th>
            <th style="width: 10%"></th>
        </tr>
    </ng-template>
    <ng-template pTemplate="body" let-item>
        <tr>
            <td>{{ item.label }}</td>
            <td>{{ item.url }}</td>
            <td>{{ item.group }}</td>
            <td>
                <div class="w-full text-right">
                    <app-web-map-service-options
                        [item]="item"
                    ></app-web-map-service-options>
                </div>
            </td>
        </tr>
    </ng-template>
    <ng-template pTemplate="emptymessage">
        <tr>
            <td colspan="100%">
                <app-items-not-found></app-items-not-found>
            </td>
        </tr>
    </ng-template>
</p-table>
